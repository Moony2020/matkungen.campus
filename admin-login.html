<!-- admin-login.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matkungen - Admin Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/admin.css" />
  </head>
  <body>
    <div class="admin-login-container">
      <div class="login-card">
        <div class="logo">
          <img src="./assets/images/logo.png" alt="Matkungen" />
          <h2>Admin Dashboard</h2>
        </div>

        <form id="admin-login-form">
          <div class="form-group">
            <label for="email">Admin Email</label>
            <div class="input-with-icon">
              <i class="ri-mail-line"></i>
              <input type="email" id="email" required />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-with-icon">
              <i class="ri-lock-line"></i>
              <input type="password" id="password" required />
              <button
                type="button"
                class="toggle-password"
                data-target="password"
              >
                <i class="ri-eye-off-line"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            <i class="ri-login-box-line"></i> Login
          </button>

          <div class="forgot-password">
            <a href="admin-forgot-password.html">Forgot Password?</a>
          </div>
        </form>

        <div class="login-footer">
          <p>© 2025 Matkungen. All rights reserved.</p>
        </div>
      </div>

      <div class="notification-toast" id="notification-toast"></div>
    </div>

    <script src="./assets/js/admin-login.js" type="module"></script>
  </body>
</html>
