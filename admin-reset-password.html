<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Admin Password</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/admin.css" />
  </head>
  <body>
    <div class="admin-login-container">
      <div class="login-card">
        <div class="logo">
          <img src="/assets/images/logo.png" alt="Matkungen" />
          <h2>Reset Admin Password</h2>
        </div>

        <form id="reset-password-form">
          <input type="hidden" id="reset-token" value="" />

          <div class="form-group">
            <label for="new-password">New Password</label>
            <div class="input-with-icon">
              <i class="ri-lock-line"></i>
              <input
                type="password"
                id="new-password"
                placeholder="Enter new password"
                required
                minlength="6"
              />
              <button
                type="button"
                class="toggle-password"
                data-target="new-password"
              >
                <i class="ri-eye-off-line"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <div class="input-with-icon">
              <i class="ri-lock-line"></i>
              <input
                type="password"
                id="confirm-password"
                placeholder="Confirm new password"
                required
                minlength="6"
              />
              <button
                type="button"
                class="toggle-password"
                data-target="confirm-password"
              >
                <i class="ri-eye-off-line"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            <i class="ri-save-line"></i> Reset Password
          </button>
        </form>
      </div>

      <div class="notification-toast" id="notification-toast"></div>
    </div>

    <script src="/assets/js/admin-reset-password.js"></script>
  </body>
</html>
