<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 
      - primary meta tags
    -->
    <title>Checkout - Matkungen</title>
    <meta name="title" content="Matkungen - Amazing & Delicious Food" />
    <meta
      name="description"
      content="This is a Restaurant html template made by mymoon"
    />
    <!-- remixicon -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <!-- 
      - favicon
    -->
    <link rel="shortcut icon" href="./assets/images/logo.png" type="image" />

    <!-- 
      - google font link
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Forum&display=swap"
      rel="stylesheet"
    />

    <!-- 
      - custom css link
    -->
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body>
    <!-- Include the same header as index.html -->

    <main class="checkout-page">
      <div class="container">
        <h1 class="headline-1 text-center">Kassan</h1>

        <div class="checkout-grid">
          <!-- Customer Information -->
          <div class="checkout-form">
            <h2>Kundinformation</h2>
            <form id="checkout-form">
              <div class="form-group">
                <label for="name">Fullständigt namn*</label>
                <input type="text" id="name" required />
              </div>
              <div class="form-group">
                <label for="email">E-post*</label>
                <input type="email" id="email" required />
              </div>
              <div class="form-group">
                <label for="phone">Telefonnummer*</label>
                <input type="tel" id="phone" required />
              </div>
              <div class="form-group">
                <label for="address">Leveransadress*</label>
                <textarea id="address" rows="2" required></textarea>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="city">Stad*</label>
                  <input type="text" id="city" required />
                </div>
                <div class="form-group">
                  <label for="zip">Postnummer*</label>
                  <input type="text" id="zip" required />
                </div>
              </div>
              <div class="form-group">
                <label for="notes">Ordernotering</label>
                <textarea id="notes" rows="2"></textarea>
              </div>
            </form>
          </div>

          <!-- Order Summary -->
          <div class="order-summary">
            <h2>Din beställning</h2>
            <div class="order-items">
              <!-- Items will be populated by JavaScript -->
            </div>

            <div class="order-totals">
              <div class="order-row">
                <span id="subtotal">Delsumma</span>
                <span id="order-subtotal">0 kr</span>
              </div>
              <div class="order-row">
                <span><strong>Leveransavgift</strong></span>
                <span class="delivery-fee">20 kr</span>
              </div>
              <div class="order-row total">
                <span>Totalt</span>
                <span class="order-total">0 </span>
              </div>
            </div>

            <button
              type="submit"
              form="checkout-form"
              class="btn btn-primary place-order"
            >
              <span class="text text-1">Fortsätt till betalning</span>
              <span class="text text-2" aria-hidden="true"
                >Fortsätt till betalning</span
              >
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- 
    - #FOOTER
  -->
    <!-- Shopping Cart Sidebar -->
    <div class="cart-sidebar">
      <div class="cart-header">
        <h3>Din varukorg</h3>
        <a href="#" class="close-cart"><i class="ri-close-line"></i></a>
      </div>
      <div class="cart-items">
        <!-- Cart items will be added here dynamically -->
      </div>
      <div class="cart-totals">
        <div class="cart-subtotal">
          <span>Delsumma:</span>
          <span class="subtotal-price">0 kr</span>
        </div>
        <a href="./checkout.html" class="btn btn-primary checkout-btn">
          <span class="text text-1">Kassan</span>

          <span class="text text-2" aria-hidden="true">Kassan</span>
        </a>
      </div>
    </div>

    <!-- 
      - custom js link
    -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="./assets/js/script.js "></script>
    <!-- 
      - ionicon link
    -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
