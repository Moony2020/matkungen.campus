<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/service.css">
      <!-- Include Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css">

</head>
<body>
   <!-- Lunch Menu -->
    <section class="menu-page lunch" id="lunch-menu">
        <div class="container">
            <div class="header-container">
                <!-- Back arrow to return to the main page -->
                    <div class="back-arrow">
                        <a href="index.html#service-section" class="btn-primary">
                        <i class="ri-arrow-left-circle-fill"></i>
                        </a>
                    </div>
                <h1 class="heading">Lunch</h1>
            </div>
    <!-- Lunch Information -->
<p class="menu-lunch-info">
    <b>Lunch: kl. 11–14 <br /></b>
    <span class="menu-item-spacing"></span> <!-- Spacer between items -->
</p>

<!-- Buttons to navigate to specific menus -->
<div class="menu-buttons">
    <div class="pizza-section">
        <p class="menu-description">Pizza 100 kr inkl. dricka</p>
        <button onclick="window.location.href='index.html#pizza-menu'" class="btn btn-pizza">
            <span class="text">Pizza Menu</span>
        </button>
    </div>
    <div class="tallrikar-section">
        <p class="menu-description">Tallrikar 80 kr inkl. dricka</p>
        <button onclick="window.location.href='index.html#dishes-menu'" class="btn btn-dishes">
            <span class="text">Tallrikar Menu</span>
        </button>
    </div>
</div>

                                          
                               
               <ul class="grid-list">
                    <li>
                        <div class="menu-card hover:card">
                            <figure class="card-banner img-holder" style="--width: 100; --height: 100;">
                                <img src="./assets/images/hamburgare.png" width="100" height="100" loading="lazy" alt="Greek Salad" class="img-cover">
                            </figure>
                            <div class="menu-card-content">
                                <div class="title-wrapper">
                                    <h3 class="menu-title">Hamburgare 90 gram</h3>
                                    <span class="span title-2">50 kr</span>
                                </div>
                                <p class="card-text">
                                    Nötfärs 90 gram, isbergssallad, tomat gurka, lök,
                        hamburgerdressing.
                                </p>
                            </div>
                        </div>
                    </li>
    
                    <li>
                        <div class="menu-card hover:card">
                            <figure class="card-banner img-holder" style="--width: 100; --height: 100;">
                                <img src="./assets/images/falafelrulle.png" width="100" height="100" loading="lazy" alt="Lasagne" class="img-cover">
                            </figure>
                            <div class="menu-card-content">
                                <div class="title-wrapper">
                                    <h3 class="menu-title">Falafelrulle</h3>
                                    <span class="span title-2">50 kr</span>
                                </div>
                                <p class="card-text">
                                    Falafel, isbergssallad, hummus, färska tomater, gurka, lök.
                                </p>
                            </div>
                        </div>
                    </li>
                
                    <!-- Add more drink items here -->
             
                </ul>
                 <!-- Shapes for the animation for background effect -->
                 <img src="./assets/images/shape-1.png" width="246" height="412" loading="lazy" alt="shape" class="shape shape-1 move-anim">
                 <img src="./assets/images/shape-2.png" width="343" height="345" loading="lazy" alt="shape" class="shape shape-2 move-anim">
         </div>
        </div>
    </section>
        <script src="./assets/js/script.js"></script>
    </body>
    </html
