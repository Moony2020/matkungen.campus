<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matkungen - Admin Forgot Password</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/admin.css" />
  </head>
  <body>
    <div class="forgot-password-container">
      <div class="forgot-password-card">
        <div class="logo">
          <img src="./assets/images/logo.png" alt="Matkungen" />
          <h2>Reset Password</h2>
        </div>

        <form id="forgot-password-form">
          <div class="form-group">
            <div class="input-with-icon">
              <i class="ri-mail-line"></i>
              <input
                type="email"
                id="email"
                required
                placeholder="Admin Emails"
              />
            </div>
          </div>

          <button type="submit" class="btn btn-primary resetLink-button">
            <i class="ri-send-plane-line"></i> Send Reset Link
          </button>

          <div class="back-to-login">
            <a href="admin-login.html"
              ><i class="ri-arrow-left-line"></i> Back to Login</a
            >
          </div>
        </form>
      </div>

      <div class="notification-toast" id="notification-toast"></div>
    </div>

    <script src="./assets/js/admin-forgot-password.js" type="module"></script>
  </body>
</html>
