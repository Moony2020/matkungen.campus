<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Matkungen</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <main class="section">
      <div class="reset-container">
        <h2>Reset Your Password</h2>
        <form id="reset-form" class="reset-form">
          <div class="form-group">
            <input
              type="password"
              id="new-password"
              class="input-field"
              placeholder="New Password"
              required
            />
          </div>
          <div class="form-group">
            <input
              type="password"
              id="confirm-password"
              class="input-field"
              placeholder="Confirm Password"
              required
            />
          </div>
          <button type="submit" class="btn text text-1">
            Reset Password
            <span class="text text-2" aria-hidden="true">Reset Password</span>
          </button>
          <div id="message"></div>
        </form>
      </div>
    </main>
    <script src="/assets/js/reset-password.js"></script>
  </body>
</html>
